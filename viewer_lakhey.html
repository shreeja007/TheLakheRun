<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lakhey Guardian 3D Model & Kinematics Inspector</title>
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0A0F1D; }
    canvas { width: 100%; height: 100%; display: block; }
    #overlay {
      position: absolute; top: 20px; left: 20px; color: #F8FAFC;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: rgba(15, 23, 42, 0.88); padding: 14px 22px; border-radius: 12px;
      border: 1px solid #334155; pointer-events: none; max-width: 480px;
    }
    #overlay h1 { margin: 0 0 6px 0; font-size: 18px; color: #F59E0B; }
    #overlay p { margin: 0; font-size: 13px; color: #94A3B8; line-height: 1.4; }
    #controls {
      position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 8px; background: rgba(15, 23, 42, 0.92);
      padding: 10px 16px; border-radius: 10px; border: 1px solid #334155;
    }
    button {
      background: #1E293B; color: #F8FAFC; border: 1px solid #475569;
      padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500;
      transition: background 0.15s, border-color 0.15s;
    }
    button:hover { background: #334155; border-color: #F59E0B; }
    button.active { background: #B91C1C; border-color: #F59E0B; }
  </style>
</head>
<body>
  <div id="overlay">
    <h1 id="view-title">Lakhey Guardian — 3D Articulated Model (v0.2)</h1>
    <p id="view-desc">2.45m Height | Ceremonial Crimson & Gold | Articulated Limbs & Chāmara Fly-Whisk</p>
  </div>
  <canvas id="canvas"></canvas>

  <div id="controls">
    <button onclick="setView('front')">1. Front</button>
    <button onclick="setView('perspective')">2. 3/4 Hero</button>
    <button onclick="setView('side')">3. Side</button>
    <button onclick="setView('chase_view')">4. Chase Rear</button>
    <button id="btn-anim" onclick="toggleAnimation()">▶ Run Stride: OFF</button>
  </div>

  <script type="module">
    import * as pc from 'playcanvas';
    window.pc = pc;

    const canvas = document.getElementById('canvas');
    const app = new pc.Application(canvas);
    window.app = app;
    app.setCanvasFillMode(pc.FILLMODE_FILL_WINDOW);
    app.setCanvasResolution(pc.RESOLUTION_AUTO);

    // Camera
    const camera = new pc.Entity('Camera');
    camera.addComponent('camera', {
      clearColor: new pc.Color(0.08, 0.11, 0.18),
      fov: 38,
      nearClip: 0.1,
      farClip: 120
    });
    app.root.addChild(camera);

    // 3-Point Studio Lighting
    const keyLight = new pc.Entity('KeyLight');
    keyLight.addComponent('light', { type: 'directional', color: new pc.Color(1.0, 0.95, 0.88), intensity: 1.6 });
    keyLight.setEulerAngles(35, 45, 0);
    app.root.addChild(keyLight);

    const fillLight = new pc.Entity('FillLight');
    fillLight.addComponent('light', { type: 'directional', color: new pc.Color(0.55, 0.7, 0.95), intensity: 0.8 });
    fillLight.setEulerAngles(25, -135, 0);
    app.root.addChild(fillLight);

    const rimLight = new pc.Entity('RimLight');
    rimLight.addComponent('light', { type: 'directional', color: new pc.Color(0.95, 0.95, 1.0), intensity: 1.3 });
    rimLight.setEulerAngles(-20, 180, 0);
    app.root.addChild(rimLight);

    // Ground Plane
    const ground = new pc.Entity('Ground');
    ground.addComponent('render', { type: 'plane' });
    ground.setLocalScale(6, 1, 6);
    ground.setLocalPosition(0, 0, 0);
    const groundMat = new pc.StandardMaterial();
    groundMat.diffuse = new pc.Color(0.12, 0.15, 0.22);
    groundMat.update();
    if (ground.render) ground.render.material = groundMat;
    app.root.addChild(ground);

    let lakheyRoot = null;
    let leftArmNode, rightArmNode, leftElbowNode, rightElbowNode;
    let leftLegNode, rightLegNode, leftKneeNode, rightKneeNode;
    let chamaraNode, maneNode, torsoNode, headNode;
    let isAnimated = false;
    let animTime = 0;

    function bindJoints(entity) {
      leftArmNode = entity.findByName('LeftArmRoot');
      rightArmNode = entity.findByName('RightArmRoot');
      leftElbowNode = entity.findByName('LeftElbowRoot');
      rightElbowNode = entity.findByName('RightElbowRoot');
      leftLegNode = entity.findByName('LeftLegRoot');
      rightLegNode = entity.findByName('RightLegRoot');
      leftKneeNode = entity.findByName('LeftKneeRoot');
      rightKneeNode = entity.findByName('RightKneeRoot');
      chamaraNode = entity.findByName('ChamaraRoot');
      maneNode = entity.findByName('ManeRoot');
      torsoNode = entity.findByName('TorsoRoot');
      headNode = entity.findByName('HeadRoot');
    }

    const glbUrl = '/models/lakhey_blockout_v02.glb';
    app.assets.loadFromUrl(glbUrl, 'container', (err, asset) => {
      const targetAsset = (!err && asset) ? asset : null;
      if (targetAsset) {
        lakheyRoot = targetAsset.resource.instantiateRenderEntity();
        lakheyRoot.setPosition(0, 0, 0);
        app.root.addChild(lakheyRoot);
        bindJoints(lakheyRoot);
        window.__LAKHEY_LOADED__ = true;
        console.log('Lakhey 3D Model loaded successfully');
      } else {
        app.assets.loadFromUrl('/models/lakhey_blockout_v01.glb', 'container', (fErr, fAsset) => {
          if (!fErr && fAsset) {
            lakheyRoot = fAsset.resource.instantiateRenderEntity();
            lakheyRoot.setPosition(0, 0, 0);
            app.root.addChild(lakheyRoot);
            bindJoints(lakheyRoot);
            window.__LAKHEY_LOADED__ = true;
          }
        });
      }
    });

    window.setView = function(preset) {
      const target = new pc.Vec3(0, 1.25, 0); // Focus on mid-torso
      const title = document.getElementById('view-title');
      const desc = document.getElementById('view-desc');

      if (preset === 'front') {
        camera.setPosition(0, 1.25, -5.2);
        camera.lookAt(target);
        title.textContent = '1. FRONT ORTHOGRAPHIC VIEW';
        desc.textContent = 'Ceremonial crimson vestment, brocade yoke, flared pleated skirt, and theatrical mask.';
      } else if (preset === 'perspective') {
        camera.setPosition(-3.2, 2.1, -4.2);
        camera.lookAt(target);
        title.textContent = '2. THREE-QUARTER PERSPECTIVE HERO VIEW';
        desc.textContent = '2.45m imposing build, cascading dark mane, gold cuffs, commanding nonviolent guardian posture.';
      } else if (preset === 'side') {
        camera.setPosition(-5.2, 1.25, 0);
        camera.lookAt(target);
        title.textContent = '3. SIDE PROFILE VIEW';
        desc.textContent = 'Deep mane volume, projecting mask brow and fangs, flared skirt clearance.';
      } else if (preset === 'chase_view') {
        camera.setPosition(0, 2.8, 5.8);
        camera.lookAt(new pc.Vec3(0, 1.4, 0));
        title.textContent = '4. CHASE CAMERA FRAMING (REAR HERO VIEW)';
        desc.textContent = 'Cascading dark mane drape, crimson vestment, and flared skirt seen from behind.';
      }
    };

    window.toggleAnimation = function() {
      isAnimated = !isAnimated;
      const btn = document.getElementById('btn-anim');
      if (btn) {
        btn.textContent = isAnimated ? '⏸ Run Stride: ON' : '▶ Run Stride: OFF';
        if (isAnimated) btn.classList.add('active');
        else btn.classList.remove('active');
      }
      if (!isAnimated && lakheyRoot) {
        // Reset to neutral
        lakheyRoot.setLocalEulerAngles(0, 0, 0);
        leftArmNode?.setLocalEulerAngles(0, 0, 0);
        leftElbowNode?.setLocalEulerAngles(0, 0, 0);
        rightArmNode?.setLocalEulerAngles(0, 0, 0);
        rightElbowNode?.setLocalEulerAngles(0, 0, 0);
        chamaraNode?.setLocalEulerAngles(0, 0, 0);
        leftLegNode?.setLocalEulerAngles(0, 0, 0);
        rightLegNode?.setLocalEulerAngles(0, 0, 0);
        leftKneeNode?.setLocalEulerAngles(0, 0, 0);
        rightKneeNode?.setLocalEulerAngles(0, 0, 0);
        maneNode?.setLocalEulerAngles(0, 0, 0);
        headNode?.setLocalEulerAngles(0, 0, 0);
        torsoNode?.setLocalEulerAngles(0, 0, 0);
      }
    };

    app.on('update', (dt) => {
      if (!isAnimated || !lakheyRoot) return;
      animTime += dt * 10.5;

      const legSwing = Math.sin(animTime) * 28.0;
      leftLegNode?.setLocalEulerAngles(legSwing, 0, 0);
      rightLegNode?.setLocalEulerAngles(-legSwing, 0, 0);

      const leftRecovery = Math.max(0, Math.sin(animTime));
      leftKneeNode?.setLocalEulerAngles(-Math.pow(leftRecovery, 0.8) * 52.0, 0, 0);

      const rightRecovery = Math.max(0, -Math.sin(animTime));
      rightKneeNode?.setLocalEulerAngles(-Math.pow(rightRecovery, 0.8) * 52.0, 0, 0);

      leftArmNode?.setLocalEulerAngles(-legSwing * 0.95 + 24.0, 0, -14);
      leftElbowNode?.setLocalEulerAngles(58.0 + Math.sin(animTime) * 20.0, 0, 0);

      rightArmNode?.setLocalEulerAngles(legSwing * 0.6 + 22.0, 0, 16);
      rightElbowNode?.setLocalEulerAngles(66.0 + Math.cos(animTime) * 16.0, 0, 0);

      const chamaraWave = Math.sin(animTime * 1.1);
      const chamaraSway = Math.cos(animTime * 1.1);
      chamaraNode?.setLocalEulerAngles(-18.0 + chamaraWave * 16.0, chamaraSway * 14.0, chamaraWave * 10.0);

      maneNode?.setLocalEulerAngles(Math.sin(animTime * 1.5 - 0.4) * 8.0, 0, 0);
      headNode?.setLocalEulerAngles(3.0 + Math.sin(animTime * 2.0) * 4.5, 0, 0);
      torsoNode?.setLocalEulerAngles(0, Math.sin(animTime) * 4.2, 0);
      lakheyRoot.setLocalEulerAngles(5.0, 0, Math.sin(animTime) * 4.2);
    });

    window.setView('perspective');
    app.start();
  </script>
</body>
</html>
