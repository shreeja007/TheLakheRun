<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>The Raths of Kumari, Bhairab & Ganesh — 3D Procession Inspector</title>
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #080C16; }
    canvas { width: 100%; height: 100%; display: block; }
    #overlay {
      position: absolute; top: 20px; left: 20px; color: #F8FAFC;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: rgba(15, 23, 42, 0.92); padding: 16px 24px; border-radius: 12px;
      border: 1px solid #334155; pointer-events: none; max-width: 520px;
    }
    #overlay h1 { margin: 0 0 6px 0; font-size: 19px; color: #F59E0B; }
    #overlay p { margin: 0; font-size: 13px; color: #94A3B8; line-height: 1.45; }
    #controls {
      position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 8px; background: rgba(15, 23, 42, 0.94);
      padding: 10px 18px; border-radius: 10px; border: 1px solid #334155;
      flex-wrap: wrap; justify-content: center;
    }
    .btn-group { display: flex; gap: 6px; }
    button {
      background: #1E293B; color: #F8FAFC; border: 1px solid #475569;
      padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }
    button:hover { background: #334155; border-color: #F59E0B; }
    button.active { background: #B91C1C; border-color: #F59E0B; color: #FFF; }
    .sep { width: 1px; background: #334155; margin: 0 4px; }
  </style>
</head>
<body>
  <div id="overlay">
    <h1 id="view-title">The Raths of Yenya (Indra Jatra) — Kumari Rath</h1>
    <p id="view-desc">Sacred Tiered Wooden Procession Chariot | Solid Timber Wheels | Pagoda Canopy | Festoon Beads | Ground Hitch Drawbeam</p>
  </div>
  <canvas id="canvas"></canvas>

  <div id="controls">
    <div class="btn-group">
      <button id="btn-kumari" class="active" onclick="switchRath('kumari')">👑 Kumari Rath</button>
      <button id="btn-bhairab" onclick="switchRath('bhairab')">🔥 Bhairab Rath</button>
      <button id="btn-ganesh" onclick="switchRath('ganesh')">🐘 Ganesh Rath</button>
    </div>
    <div class="sep"></div>
    <div class="btn-group">
      <button onclick="setView('perspective')">1. 3/4 Hero</button>
      <button onclick="setView('front')">2. Front (Drawbeam)</button>
      <button onclick="setView('side')">3. Side (Wheels)</button>
      <button onclick="setView('top')">4. Top (Canopy)</button>
    </div>
    <div class="sep"></div>
    <div class="btn-group">
      <button id="btn-roll" onclick="toggleWheelRoll()">🔄 Wheel Roll: OFF</button>
      <button id="btn-sway" onclick="toggleProcessionSway()">🚩 Procession Sway: OFF</button>
    </div>
  </div>

  <script type="module">
    import * as pc from 'playcanvas';
    window.pc = pc;

    const canvas = document.getElementById('canvas');
    const app = new pc.Application(canvas);
    window.app = app;
    app.setCanvasFillMode(pc.FILLMODE_FILL_WINDOW);
    app.setCanvasResolution(pc.RESOLUTION_AUTO);

    // Camera
    const camera = new pc.Entity('Camera');
    camera.addComponent('camera', {
      clearColor: new pc.Color(0.04, 0.06, 0.11),
      fov: 46,
      nearClip: 0.1,
      farClip: 120
    });
    app.root.addChild(camera);

    // Studio 3-Point Lighting
    const keyLight = new pc.Entity('KeyLight');
    keyLight.addComponent('light', { type: 'directional', color: new pc.Color(1.0, 0.94, 0.82), intensity: 1.6 });
    keyLight.setEulerAngles(38, -35, 0);
    app.root.addChild(keyLight);

    const fillLight = new pc.Entity('FillLight');
    fillLight.addComponent('light', { type: 'directional', color: new pc.Color(0.42, 0.55, 0.78), intensity: 0.9 });
    fillLight.setEulerAngles(25, 145, 0);
    app.root.addChild(fillLight);

    const rimLight = new pc.Entity('RimLight');
    rimLight.addComponent('light', { type: 'directional', color: new pc.Color(0.95, 0.78, 0.45), intensity: 1.2 });
    rimLight.setEulerAngles(-20, -160, 0);
    app.root.addChild(rimLight);

    // Ground Pedestal
    const ground = new pc.Entity('Pedestal');
    ground.addComponent('render', { type: 'cylinder' });
    ground.setLocalScale(14.0, 0.15, 14.0);
    ground.setLocalPosition(0, -0.075, 0);
    const groundMat = new pc.StandardMaterial();
    groundMat.diffuse = new pc.Color(0.10, 0.13, 0.18);
    groundMat.gloss = 0.3;
    groundMat.update();
    if (ground.render) ground.render.material = groundMat;
    app.root.addChild(ground);

    // Models Cache
    const raths = {
      kumari: { url: '/models/kumari_rath.glb', entity: null, wheels: [], name: 'Kumari Rath', desc: 'Central Sacred Chariot of the Living Goddess | 4.25m Tall Pagoda Canopy | Crimson Dais | Solid Sal Wheels' },
      bhairab: { url: '/models/bhairab_rath.glb', entity: null, wheels: [], name: 'Bhairab Rath', desc: 'Fierce Companion Chariot | Lower Stance, Heavier Timber Bracing & Reinforced Chassis' },
      ganesh: { url: '/models/ganesh_rath.glb', entity: null, wheels: [], name: 'Ganesh Rath', desc: 'Auspicious Guardian Chariot | Narrower 2.6m Frame, Slimmer Corner Posts & Distinctive Finial' },
    };
    let currentRathKey = 'kumari';
    let isRolling = false;
    let isSwaying = false;
    let animTime = 0;
    let wheelPitch = 0;

    function findWheels(root) {
      const wheels = [];
      root.forEach(node => {
        if (node.name && node.name.startsWith('Wheel_')) {
          wheels.push(node);
        }
      });
      return wheels;
    }

    function loadRath(key, onComplete) {
      if (raths[key].entity) {
        if (onComplete) onComplete(raths[key]);
        return;
      }
      app.assets.loadFromUrl(raths[key].url, 'container', (err, asset) => {
        if (err) {
          console.error(`Failed to load ${key}:`, err);
          return;
        }
        const modelEntity = asset.resource.instantiateRenderEntity();
        modelEntity.name = raths[key].name;
        modelEntity.setLocalPosition(0, 0, 0);
        app.root.addChild(modelEntity);
        raths[key].entity = modelEntity;
        raths[key].wheels = findWheels(modelEntity);
        console.log(`Loaded ${key} with ${raths[key].wheels.length} wheel nodes:`, raths[key].wheels.map(w => w.name));
        if (onComplete) onComplete(raths[key]);
      });
    }

    window.switchRath = function(key) {
      currentRathKey = key;
      ['kumari', 'bhairab', 'ganesh'].forEach(k => {
        const btn = document.getElementById(`btn-${k}`);
        if (btn) btn.className = (k === key) ? 'active' : '';
        if (raths[k].entity) raths[k].entity.enabled = (k === key);
      });

      const title = document.getElementById('view-title');
      const desc = document.getElementById('view-desc');
      title.textContent = `The Raths of Yenya (Indra Jatra) — ${raths[key].name}`;
      desc.textContent = raths[key].desc;

      loadRath(key, (r) => {
        ['kumari', 'bhairab', 'ganesh'].forEach(k => {
          if (raths[k].entity) raths[k].entity.enabled = (k === currentRathKey);
        });
        window.__ACTIVE_RATH__ = r;
      });
    };

    window.setView = function(mode) {
      const target = new pc.Vec3(0, 2.0, 0.4);
      if (mode === 'perspective') {
        camera.setPosition(6.8, 3.8, 6.4);
        camera.lookAt(target);
      } else if (mode === 'front') {
        camera.setPosition(0, 2.2, 7.8);
        camera.lookAt(target);
      } else if (mode === 'side') {
        camera.setPosition(8.4, 2.2, 0.4);
        camera.lookAt(target);
      } else if (mode === 'top') {
        camera.setPosition(0, 9.2, 0.41);
        camera.lookAt(target);
      }
    };

    window.toggleWheelRoll = function() {
      isRolling = !isRolling;
      const btn = document.getElementById('btn-roll');
      btn.textContent = isRolling ? '⏸ Wheel Roll: ON' : '🔄 Wheel Roll: OFF';
      btn.className = isRolling ? 'active' : '';
    };

    window.toggleProcessionSway = function() {
      isSwaying = !isSwaying;
      const btn = document.getElementById('btn-sway');
      btn.textContent = isSwaying ? '⏸ Procession Sway: ON' : '🚩 Procession Sway: OFF';
      btn.className = isSwaying ? 'active' : '';
      if (!isSwaying) {
        const active = raths[currentRathKey].entity;
        if (active) active.setLocalEulerAngles(0, 0, 0);
      }
    };

    app.on('update', (dt) => {
      animTime += dt;
      const activeData = raths[currentRathKey];
      if (!activeData || !activeData.entity) return;

      // Wheel Roll Rotation
      if (isRolling && activeData.wheels.length > 0) {
        // Roll speed: 1.8 rad/sec around local X
        wheelPitch = (wheelPitch + 180 * dt) % 360;
        for (const w of activeData.wheels) {
          w.setLocalEulerAngles(wheelPitch, 0, 0);
        }
      }

      // Procession Sway
      if (isSwaying) {
        const rollSway = Math.sin(animTime * 2.2) * 1.8;
        const pitchSway = Math.cos(animTime * 1.6) * 0.9;
        activeData.entity.setLocalEulerAngles(pitchSway, 0, rollSway);
      }
    });

    // Start with Kumari Rath in perspective view
    window.switchRath('kumari');
    window.setView('perspective');

    app.start();
  </script>
</body>
</html>
